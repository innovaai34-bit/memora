  const cards=ex.map(e=>'<div class="xcard">'
    +'<div class="nm">'+esc(autorNombre(e.k))+(e.persona?'':'<span class="chip plain">Equipo o área</span>')+'</div>'
    +'<div class="tags">'+e.areaTop.slice(0,2).map(a=>'<button class="tag" data-filtro="area" data-valor="'+esc(a)+'">'+esc(a)+'</button>').join("")+'</div>'
    +'<div class="xstats">'
      +'<div><span>Aportes</span><b>'+e.aportes+'</b></div>'
      +'<div><span>Aprobados</span><b>'+e.aprobados+'</b></div>'
      +'<div><span>Consultas</span><b>'+e.consultas+'</b></div>'
      +'<div><span>Reutilizados</span><b>'+e.reusos+'</b></div>'
    +'</div>'
    +'<p class="muted" style="font-size:.82rem;margin:0">Procesos que ha documentado: '+esc(e.procTop.slice(0,3).join(", ")||"—")+'</p>'
    +'<div class="actrow"><button class="btn small" data-filtro="autor" data-valor="'+esc(e.k)+'">Ver sus aportes</button></div>'
  +'</div>').join("");
  const porArea=AREAS.map(a=>{
    const n=listaAportes().filter(x=>x.a.area===a).length;
    const quien=ex.filter(e=>e.areas[a]).slice(0,1).map(e=>autorNombre(e.k))[0]||"";
    return {a:a,n:n,quien:quien};
  }).sort((x,y)=>y.n-x.n);
  const sinDoc=PROCESOS.filter(pr=>pr!=="Otro"&&!listaAportes().some(x=>x.a.proceso===pr));
  return cab
  +'<h3 style="font-size:1rem;margin-bottom:.6rem">Quién documenta el conocimiento</h3>'
  +'<div class="experts">'+cards+'</div>'
  +'<div class="charts" style="margin-top:1.2rem">'
    +'<div class="card pad"><p class="sectitle">Cobertura por área</p>'
      +'<div class="cover">'+porArea.map(r=>'<button class="coverrow" data-filtro="area" data-valor="'+esc(r.a)+'"><span class="nm">'+esc(r.a)+'</span><span class="st '+(r.n?"si":"no")+'">'+(r.n?esc(r.quien||"documentada"):"sin documentar")+'</span><b>'+r.n+'</b></button>').join("")+'</div>'
      +'<p class="muted" style="font-size:.8rem;margin-top:.7rem">Un área sin aportes no significa que no tenga conocimiento, sino que ese conocimiento sigue solo en las personas.</p></div>'
    +'<div class="card pad"><p class="sectitle">Procesos sin conocimiento documentado</p>'
      +(sinDoc.length?'<p class="muted" style="font-size:.86rem;margin:0">'+sinDoc.length+' de '+(PROCESOS.length-1)+' procesos del catálogo no tienen ningún aporte. Son los candidatos naturales para la siguiente campaña de documentación: toca el proceso para registrar un aporte con él ya seleccionado.</p>'
        +'<div class="gaps">'+sinDoc.map(pr=>'<button data-nuevoproc="'+esc(pr)+'">+ '+esc(pr)+'</button>').join("")+'</div>'
        :'<p class="muted" style="font-size:.86rem;margin:0">Todos los procesos del catálogo tienen al menos un aporte registrado. El siguiente paso es la profundidad: revisar que cada proceso tenga su conocimiento crítico y no solo un contenido suelto.</p>')
    +'</div>'
  +'</div>';
}

/* ============ eventos ============ */
function conectar(r){
  const root=document.body;
  root.onclick=ev=>{
    const t=ev.target.closest("[data-ir],[data-abrir],[data-quick],[data-filtro],[data-clave],[data-limpiar],[data-quitar],[data-editar],[data-cancelar],[data-reset],[data-delkw],[data-addkw],[data-cmt],[data-util],[data-reuso],[data-val],[data-preguntar],[data-ejemplo],[data-limpiarask],[data-nuevoproc]");
    if(!t) return;
    const d=t.dataset;
    if(d.abrir!==undefined){ ev.stopPropagation(); ir("aporte-"+d.abrir); return; }
    if(d.ir!==undefined){ if(d.ir==="nuevo"&&S.editId===null){} ir(d.ir); return; }
    if(d.filtro!==undefined){ ev.stopPropagation(); aplicarFiltro(d.filtro,d.valor); return; }
    if(d.clave!==undefined){ ev.stopPropagation(); limpiarFiltros(); S.fClave=d.clave; ir("buscar"); return; }
    if(d.quick!==undefined){ ev.stopPropagation(); aplicarQuick(d.quick); return; }
    if(d.limpiar!==undefined){ limpiarFiltros(); render(); return; }
    if(d.quitar!==undefined){ quitarFiltro(d.quitar); return; }
    if(d.editar!==undefined){ abrirEdicion(d.editar); return; }
    if(d.cancelar!==undefined){ const id=S.editId; S.editId=null; S.form={claves:[]}; S.formErr=""; ir(id?"aporte-"+id:"buscar"); return; }
    if(d.reset!==undefined){ if(S.editId) abrirEdicion(S.editId,true); else { S.form={claves:[]}; S.formErr=""; render(); } return; }
    if(d.delkw!==undefined){ leerForm(); S.form.claves.splice(+d.delkw,1); render(); return; }
    if(d.addkw!==undefined){ leerForm(); if(S.form.claves.indexOf(d.addkw)<0&&S.form.claves.length<8) S.form.claves.push(d.addkw); render(); return; }
    if(d.cmt!==undefined){ publicarCmt(d.id,d.cmt); return; }
    if(d.util!==undefined){ toggleUtil(d.util); return; }
    if(d.reuso!==undefined){ registrarReuso(d.reuso); return; }
    if(d.val!==undefined){ validar(d.id,d.val,d.rapido==="1"); return; }
    if(d.preguntar!==undefined){ preguntar(); return; }
    if(d.ejemplo!==undefined){ S.pregunta=EJEMPLOS[+d.ejemplo]||""; S.respuesta=null; S.sampleErr=""; render(); const e=$("preg"); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } return; }
    if(d.limpiarask!==undefined){ S.pregunta=""; S.respuesta=null; S.sampleErr=""; render(); const e=$("preg"); if(e) e.focus(); return; }
    if(d.nuevoproc!==undefined){ S.editId=null; S.formErr=""; S.form={claves:[],proceso:d.nuevoproc}; ir("nuevo"); return; }
  };
  document.querySelectorAll(".item[data-abrir]").forEach(el=>{ el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir("aporte-"+el.dataset.abrir); } }; });
  const q=$("q");
  if(q) q.oninput=()=>{ const p=q.selectionStart; S.q=q.value; render(); const n=$("q"); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  const bind=(id,key)=>{ const e=$(id); if(e) e.onchange=()=>{ S[key]=e.value; render(); }; };
  bind("fArea","fArea"); bind("fProceso","fProceso"); bind("fEstado","fEstado"); bind("orden","orden");
  if(r.v==="asistente"){ const e=$("preg"); if(e){ e.oninput=()=>{ S.pregunta=e.value; }; e.onkeydown=ev2=>{ if(ev2.key==="Enter"&&(ev2.metaKey||ev2.ctrlKey)){ ev2.preventDefault(); preguntar(); } }; } }
  if(r.v==="nuevo") conectarForm();
  if(r.v==="detalle") conectarDetalle(r.id);
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmouseenter=ev=>mostrarTip(el.dataset.tip,ev); el.onmousemove=ev=>mostrarTip(el.dataset.tip,ev); el.onmouseleave=ocultarTip;
  });
}
function aplicarFiltro(campo,valor){
  limpiarFiltros();
  if(campo==="area") S.fArea=valor; else if(campo==="proceso") S.fProceso=valor;
  else if(campo==="tipo") S.fTipo=valor; else if(campo==="estado") S.fEstado=valor;
  else if(campo==="autor") S.fAutor=valor;
  ir("buscar");
}
function aplicarQuick(k){
  if(k==="todos"){ limpiarFiltros(); }
  else if(k==="mios"){ const v=!S.fMios; limpiarFiltros(); S.fMios=v; }
  else if(k==="vigencia"){ const v=!S.fVigencia; limpiarFiltros(); S.fVigencia=v; }
  else if(k==="consultas"||k==="reusos"){ limpiarFiltros(); S.orden=k; }
  else { const v=S.fEstado===k?"":k; limpiarFiltros(); S.fEstado=v; }
  ir("buscar");
}
function quitarFiltro(k){
  if(k==="q") S.q=""; else if(k==="fMios") S.fMios=false; else if(k==="fVigencia") S.fVigencia=false; else S[k]="";
  render();
}
function mostrarTip(t,ev){ const tip=$("tip"); tip.textContent=t; tip.style.opacity="1"; tip.style.left=Math.min(ev.clientX+12,window.innerWidth-190)+"px"; tip.style.top=Math.max(8,ev.clientY-34)+"px"; }
function ocultarTip(){ $("tip").style.opacity="0"; }

/* ---------- formulario ---------- */
function leerForm(){
  const g=id=>{const e=$(id);return e?e.value.trim():(S.form[id]||"");};
  S.form.titulo=g("titulo");S.form.area=g("area");S.form.proceso=g("proceso");S.form.tipo=g("tipo");S.form.acceso=g("acceso");
  S.form.contexto=g("contexto");S.form.accion=g("accion");S.form.resultado=g("resultado");S.form.recomendaciones=g("recomendaciones");
  const c=$("confi"); if(c) S.form.confi=c.checked;
}
function conectarForm(){
  const kw=$("kw");
  if(kw) kw.onkeydown=e=>{
    if(e.key==="Enter"||e.key===","){ e.preventDefault(); const v=kw.value.trim().replace(/,$/,"");
      if(v&&(S.form.claves||[]).map(x=>x.toLowerCase()).indexOf(v.toLowerCase())<0&&S.form.claves.length<8){ leerForm(); S.form.claves.push(v); render(); const n=$("kw"); if(n)n.focus(); } }
    else if(e.key==="Backspace"&&!kw.value&&S.form.claves.length){ leerForm(); S.form.claves.pop(); render(); const n=$("kw"); if(n)n.focus(); }
  };
  ["tipo","area","proceso"].forEach(id=>{ const e=$(id); if(e) e.onchange=()=>{ leerForm(); render(); }; });
  ["titulo","contexto","accion"].forEach(id=>{ const e=$(id); if(e){ let t=null; e.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ const p=e.selectionStart; leerForm(); render(); const n=$(id); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(err){} } },700); }; } });
  const c=$("confi"); if(c) c.onchange=()=>{ leerForm(); render(); };
  const f=$("formAp"); if(f) f.onsubmit=e=>{ e.preventDefault(); guardar(); };
}
function abrirEdicion(id,silencioso){
  const a=S.aportes.get(id); if(!a) return;
  S.editId=id; S.formErr="";
  S.form={titulo:a.titulo||"",area:a.area||"",proceso:a.proceso||"",tipo:a.tipo||"",acceso:a.acceso||ACCESOS[0],
    claves:(a.claves||[]).slice(),contexto:a.contexto||"",accion:a.accion||"",resultado:a.resultado||"",recomendaciones:a.recomendaciones||"",confi:false};
  if(silencioso) render(); else ir("nuevo");
}
async function guardar(){
  leerForm();
  const f=S.form, falta=[];
  if(!f.titulo||f.titulo.length<8) falta.push("un título de al menos 8 caracteres");
  if(!f.area) falta.push("el área responsable");
  if(!f.proceso) falta.push("el proceso relacionado");
  if(!f.tipo) falta.push("el tipo de conocimiento");
  if(!f.contexto||f.contexto.length<20) falta.push("el contexto o problema (mínimo 20 caracteres)");
  if(!f.accion||f.accion.length<20) falta.push("la acción realizada (mínimo 20 caracteres)");
  if(!(f.claves||[]).length) falta.push("al menos una palabra clave");
  if(!f.confi) falta.push("la confirmación de revisión de confidencialidad");
  if(falta.length){ S.formErr="Falta "+falta.join("; ")+"."; render(); const e=$("formAp"); if(e) e.scrollIntoView({block:"nearest"}); return; }
  if(!S.db){ S.formErr="No hay conexión con el almacén de datos. Intenta de nuevo en unos segundos."; render(); return; }
  S.busy="1"; S.formErr=""; render();
  const ahora=new Date().toISOString();
  const base={titulo:f.titulo,area:f.area,proceso:f.proceso,tipo:f.tipo,acceso:f.acceso||ACCESOS[0],claves:f.claves,
    contexto:f.contexto,accion:f.accion,resultado:f.resultado||"",recomendaciones:f.recomendaciones||"",actualizadoEn:ahora};
  try{
    if(S.editId){
      const prev=S.aportes.get(S.editId)||{};
      await S.db.doc("aportes/"+S.editId).set(Object.assign({},prev,base,{ediciones:(prev.ediciones||0)+1}));
      const id=S.editId; S.editId=null; S.busy=""; S.form={claves:[]};
      S.aviso="Cambios guardados. El aporte vuelve a la cola de validación."; ir("aporte-"+id);
    }else{
      const id="a-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
      await S.db.collection("aportes").doc(id).set(Object.assign({},base,{autorId:S.uid||null,creadoEn:ahora,ediciones:0,vistas:{},utiles:{},reusos:{},comentaristas:{}}));
      S.busy=""; S.form={claves:[]};
      S.aviso="Aporte enviado a revisión. Un validador confirmará su publicación."; ir("aporte-"+id);
    }
  }catch(err){
    S.busy="";
    S.formErr=(err&&err.code==="invalid_argument")?"Tu perfil no tiene permiso para guardar en esta plataforma.":"No se pudo guardar. Revisa tu conexión e intenta de nuevo.";
    render();
  }
}

/* ---------- detalle: interacción ---------- */
function conectarDetalle(id){
  if(S.cmtId!==id){
    if(S.unsubCmt){ S.unsubCmt(); S.unsubCmt=null; }
    S.comentarios=[]; S.cmtId=id;
    if(S.db){
      try{ S.unsubCmt=S.db.collection("aportes/"+id+"/comentarios").orderBy("creadoEn","asc").limit(200).onSnapshot(snap=>{
        S.comentarios=snap.docs.map(d=>d.data()||{}); resolverPerfiles(); render(); },()=>{}); }catch(e){}
    }
    registrarVista(id);
  }
  const t=$("cmt"); if(t) t.oninput=()=>{ S.cmtDraft=t.value; };
}
async function registrarVista(id){
  if(!S.db||!S.uid||S.canWrite===false||S.vistasHechas.has(id)||!S.aportes.has(id)) return;
  S.vistasHechas.add(id);
  const a=S.aportes.get(id)||{};
  const n=(a.vistas&&typeof a.vistas[S.uid]==="number"?a.vistas[S.uid]:0)+1;
  try{ await S.db.doc("aportes/"+id).update({vistas:{[S.uid]:n}}); }catch(e){}
}
async function toggleUtil(id){
  if(!S.db||!S.uid) return;
  const a=S.aportes.get(id)||{}, yo=!!(a.utiles&&a.utiles[S.uid]);
  try{
    const utiles=Object.assign({},a.utiles||{});
    if(yo) delete utiles[S.uid]; else utiles[S.uid]=true;
    await S.db.doc("aportes/"+id).set(Object.assign({},a,{utiles:utiles}));
  }catch(e){}
}
async function registrarReuso(id){
  if(!S.db||!S.uid) return;
  const a=S.aportes.get(id)||{};
  const n=(a.reusos&&typeof a.reusos[S.uid]==="number"?a.reusos[S.uid]:0)+1;
  const texto=(S.cmtDraft||"").trim()||"Apliqué este conocimiento en mi proceso.";
  try{
    await S.db.doc("aportes/"+id).update({reusos:{[S.uid]:n},comentaristas:{[S.uid]:true}});
    await S.db.collection("aportes/"+id+"/comentarios").add({tipo:"reuso",texto:texto,autorId:S.uid,creadoEn:new Date().toISOString()});
    S.cmtDraft=""; S.aviso="Reutilización registrada. Gracias: ese dato alimenta el indicador de reutilización."; render();
  }catch(e){}
}
async function publicarCmt(id,tipo){
  const texto=(S.cmtDraft||"").trim();
  if(!texto){ S.aviso=""; const t=$("cmt"); if(t) t.focus(); return; }
  if(!S.db||!S.uid) return;
  try{
    await S.db.collection("aportes/"+id+"/comentarios").add({tipo:tipo,texto:texto,autorId:S.uid,creadoEn:new Date().toISOString()});
    await S.db.doc("aportes/"+id).update({comentaristas:{[S.uid]:true}});
    S.cmtDraft=""; S.aviso=tipo==="actualizacion"?"Propuesta de actualización enviada; el validador la verá en la ficha.":"Comentario publicado."; render();
  }catch(e){}
}
async function validar(id,estado,rapido){
  if(!S.db||!S.canEdit) return;
  let nota="",prox="";
  if(!rapido){ nota=$("vnota")?$("vnota").value.trim():""; prox=$("vprox")?$("vprox").value:""; }
  else if(estado==="aprobado"){ const d=new Date(); d.setMonth(d.getMonth()+6); prox=d.toISOString().slice(0,10); }
  try{
    await S.db.doc("data/editors-only/revisiones/"+id).set({estado:estado,nota:nota,proximaRevision:estado==="aprobado"?prox:"",
      revisorId:S.uid||null,revisadoEn:new Date().toISOString()});
    S.aviso={aprobado:"Aporte aprobado y publicado como conocimiento validado.",ajustes:"Aporte devuelto para ajustes.",archivado:"Aporte archivado.",pendiente:"Aporte devuelto a la cola de validación."}[estado]||"";
    render();
  }catch(e){}
}
})();
</script>
